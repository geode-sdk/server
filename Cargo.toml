[package]
name = "geode-index"
version = "0.57.1"
edition = "2024"

[features]
serve-static = ["dep:actix-files"]

[dependencies]
actix-cors = "0.7"
actix-files = { version = "0.6", optional = true }
actix-multipart = "0.8"
actix-web = "4.10"
ammonia = "4"
anyhow = "1.0"
argon2 = "0.5.3"
bytes = "1.11"
chrono = { version = "0.4", features = ["default", "serde"] }
clap = { version = "4.5", features = ["derive"] }
constant_time_eq = "0.5.0"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4.3"
http = "0.2" # 0.2 is required for actix-web compat in middleware
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "pool",
    "tokio1-rustls",
    "ring",
] }
moka = { version = "0.12.13", features = ["future"] }
parking_lot = "0.12.5"
regex = "1.10"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "gzip",
    "rustls",
    "query",
    "http2",
] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0" # I know we already use sha256, it pulls sha2 anyway, I added it for urisign
sha256 = "1.5"
sqlx = { version = "0.9", features = [
    "postgres",
    "runtime-tokio",
    "chrono",
    "uuid",
    "ipnetwork",
] }
thiserror = "2.0.12"
tokio = { version = "1.44", features = ["rt", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
url = "2.5.8"
urlencoding = "2.1.3"
utoipa = { version = "5.4.0", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
uuid = { version = "1.8", features = ["v4", "fast-rng", "macro-diagnostics"] }
validator = { version = "0.20.0", features = ["derive"] }
zip = "8.6.0"
# have to do this until https://github.com/durch/rust-s3/pull/452 is merged :(
rust-s3 = { git = "https://github.com/w4nderlust/rust-s3", rev = "2936eb7", default-features = false, features = [
    "tokio-rustls-tls",
    "fail-on-err",
] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"
